[package]
name = "zed-local-cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ciborium = "0.2.2"
clap = { version = "4.6.6", features = ["derive"] }
dashmap = "6.2.1"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.10.2"
rsa = { version = "0.10.0-rc.18", features = ["serde"] }
rustc-hash = "2.1.3"
secretspec = { version = "0.20.0", default-features = false }
secretspec-derive = "0.20.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "time", "uuid"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.5"
topcoat = { version = "0.8.1", default-features = false, features = ["asset", "cookie", "discover", "router", "runtime", "serve", "tailwind", "tower", "view", "websocket"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = "1.26.0"

[build-dependencies]
topcoat = { version = "*", default-features = false, features = ["tailwind"] }

[target."cfg(false)".dependencies]
# add the native roots feature to reqwest pulled in by openidconnect
reqwest = { version = "*", default-features = false, features = ["rustls-tls-native-roots"] }
