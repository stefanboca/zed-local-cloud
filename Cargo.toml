[package]
name = "zed-local-cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
openidconnect = { version = "4.0.1", features = ["rustls-tls"] }
rand = "0.10.2"
rsa = "0.10.0-rc.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = {
  version = "0.9.0",
  default-features = false,
  features = ["macros", "migrate", "postgres", "runtime-tokio", "uuid"]
}
tokio = {
  version = "1.53.1",
  features = ["macros", "net", "rt-multi-thread", "signal", "time"]
}
toml = "1.1.4"
topcoat = {
  version = "0.5.0",
  default-features = false,
  features = [
    "cookie",
    "discover",
    "router",
    "serve",
    "session",
    "view",
    "websocket"
  ]
}
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = "1.24.0"

# add the native roots feature to reqwest pulled in by openidconnect
reqwest = { version = "*", features = ["rustls-tls-native-roots"] }
