[package]
name = "zed-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.32"
reqwest = { version = "0.12.28", features = ["native-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = "0.29.0"
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = "1.21.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
