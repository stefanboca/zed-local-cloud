[project]
name = "zed-local-cloud"
revision = "1.0"

[providers]
environment = "env://"
systemd = "systemd-credential://"

[profiles.development]
COOKIE_KEY = { description = "Key used to authenticate browser session cookies", default = "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMA==" }
DATABASE_URL = { description = "PostgreSQL connection URL", default = "postgres://development:development@127.0.0.1:5432/zed" }
INTERNAL_API_KEY = { description = "Bearer token shared by local-cloud and collab", default = "development-development-development" }
LIVEKIT_KEYS = { description = "LiveKit application keys", required = false }
OIDC_CLIENT_SECRET = { description = "OIDC client secret", default = "development" }

[profiles.development.defaults]
providers = ["environment"]

[profiles.production]
COOKIE_KEY = { description = "Key used to authenticate browser session cookies", type = "base64", generate = { bytes = 64 }, ref = { item = "COOKIE_KEY" } }
DATABASE_URL = { description = "PostgreSQL connection URL", ref = { item = "DATABASE_URL" } }
INTERNAL_API_KEY = { description = "Bearer token shared by local-cloud and collab", type = "base64", generate = { bytes = 128 }, ref = { item = "INTERNAL_API_KEY" } }
LIVEKIT_KEY = { description = "LiveKit API key used by collab", required = false, ref = { item = "LIVEKIT_KEY" } }
LIVEKIT_KEYS = { description = "LiveKit application keys supplied by the system administrator", required = false, ref = { item = "LIVEKIT_KEYS" } }
LIVEKIT_SECRET = { description = "LiveKit API secret used by collab", required = false, ref = { item = "LIVEKIT_SECRET" } }
OIDC_CLIENT_SECRET = { description = "OIDC client secret supplied by the system administrator", ref = { item = "OIDC_CLIENT_SECRET" } }
ZED_CLOUD_INTERNAL_API_KEY = { description = "Bearer token exposed to collab", composed = "${INTERNAL_API_KEY}" }

[profiles.production.defaults]
providers = ["systemd"]

[scopes.generated]
secrets = ["COOKIE_KEY", "INTERNAL_API_KEY"]

[scopes.provision]
secrets = ["DATABASE_URL", "LIVEKIT_KEYS"]

[scopes.collab]
secrets = ["DATABASE_URL", "LIVEKIT_KEY", "LIVEKIT_SECRET", "ZED_CLOUD_INTERNAL_API_KEY"]
